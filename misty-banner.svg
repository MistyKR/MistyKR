<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Misty — Nocturne Archive</title>
  <desc id="desc">A midnight-blue celestial archive banner with champagne-gold orbital geometry and a central diamond emblem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1421"/>
      <stop offset=".52" stop-color="#142235"/>
      <stop offset="1" stop-color="#090f19"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6d3a7"/>
      <stop offset=".5" stop-color="#b99a62"/>
      <stop offset="1" stop-color="#806943"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#b99a62" stop-opacity=".18"/>
      <stop offset="1" stop-color="#b99a62" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="137" height="113" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1" fill="#e6d3a7" opacity=".55"/>
      <circle cx="81" cy="39" r=".8" fill="#e6d3a7" opacity=".4"/>
      <circle cx="119" cy="91" r="1.1" fill="#e6d3a7" opacity=".45"/>
      <path d="M48 83v7m-3.5-3.5h7" stroke="#e6d3a7" stroke-width=".7" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#stars)"/>
  <ellipse cx="750" cy="245" rx="520" ry="270" fill="url(#glow)"/>
  <g fill="none" stroke="url(#gold)" opacity=".68">
    <ellipse cx="750" cy="250" rx="555" ry="170" stroke-width="1.2" transform="rotate(-13 750 250)"/>
    <ellipse cx="750" cy="250" rx="470" ry="205" stroke-width=".8" transform="rotate(19 750 250)"/>
    <circle cx="750" cy="250" r="188" stroke-width=".8" stroke-dasharray="2 9"/>
    <circle cx="750" cy="250" r="218" stroke-width=".6" stroke-dasharray="1 12"/>
  </g>
  <g stroke="#b99a62" fill="none" opacity=".55">
    <path d="M90 72h1320M90 428h1320" stroke-width=".7"/>
    <path d="M115 62v20m-10-10h20M1385 62v20m-10-10h20M115 418v20m-10-10h20M1385 418v20m-10-10h20" stroke-width="1"/>
    <path d="M750 48v48M750 404v48" stroke-width=".7" stroke-dasharray="2 5"/>
  </g>
  <g transform="translate(750 208)" fill="none" stroke="url(#gold)" stroke-width="1.5">
    <path d="M0-82 58-24 0 34-58-24Z"/>
    <path d="M0-58 35-24 0 11-35-24Z" opacity=".8"/>
    <path d="M0-82v-26m0 142v-26M-58-24h-26m168 0H58" opacity=".65"/>
    <circle cx="0" cy="-24" r="4" fill="#d9c28f" stroke="none"/>
    <path d="M0-116l4 10-4 10-4-10Z" fill="#d9c28f" stroke="none"/>
  </g>
  <g text-anchor="middle">
    <text x="750" y="320" fill="#eee4d0" font-family="Georgia, 'Times New Roman', serif" font-size="66" letter-spacing="15">MISTY</text>
    <text x="750" y="359" fill="#c3a979" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="5">INDEPENDENT CREATOR · DEVELOPER</text>
    <text x="750" y="395" fill="#c9c0b1" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" letter-spacing="1.2">Curiosity is an endless pursuit.</text>
  </g>
  <g fill="#c3a979" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" opacity=".8">
    <text x="120" y="110">NOCTURNE ARCHIVE</text>
    <text x="1380" y="110" text-anchor="end">VOL. 01 · MMXXVI</text>
    <text x="120" y="405">EST. BY MISTY</text>
    <text x="1380" y="405" text-anchor="end">AFTERLIGHT MAKER'S MARK</text>
  </g>
</svg>